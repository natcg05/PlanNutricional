<script>

const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toDateString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=(name,req,lean,veg)=>({id:uid(),name,req:{c:0,f:0,p:0,l:0,g:0,...req},lean,veg,sel:[],vegs:[]});
function init(){return{day:today(),
 meals:[M('Desayuno',{c:2,f:1,l:1,p:1,g:3},true,false),M('Almuerzo',{c:2,p:4,g:1},false,true),M('Cena',{c:1,p:4,g:1},true,true)],
 foods:RAW.split('\n').map(r=>{const[c,n,a,u,no]=r.split('|');return{id:uid(),cat:c,name:n,amt:a,unit:u,note:no,on:!OFF.includes(n)}}),

function load(){try{const s=JSON.parse(localStorage.getItem('plan-v1'));if(s&&s.meals){if(s.day!==today()){s.day=today();s.supps.forEach(x=>x.done=false)}s.meals.forEach(m=>{if(!Array.isArray(m.vegs))m.vegs=[]});return s}}catch(e){}return init()}
function save(){try{localStorage.setItem('plan-v1',JSON.stringify(S))}catch(e){}}
let S=load(),UI={tab:'m',pick:{},d:{},pw:{},open:{},anim:1,tp:{}};
const fd=id=>S.foods.find(f=>f.id==id),ml=id=>S.meals.find(m=>m.id==id);
function used(m){const u={c:0,f:0,p:0,l:0,g:0};m.sel.forEach(s=>{const f=fd(s.id);if(f)for(const k in EF[f.cat])u[k]+=EF[f.cat][k]*s.n});return u}
function can(m,f){if(m.lean&&f.cat=='pg')return'Esta comida pide proteína sin grasa';const u=used(m),e=EF[f.cat];for(const k in e)if(u[k]+e[k]>m.req[k])return'No queda cupo de '+NAMES[k].toLowerCase();return''}
function add(mid,fid){const m=ml(mid),f=fd(fid);if(can(m,f))return;const s=m.sel.find(x=>x.id==fid);s?s.n++:m.sel.push({id:fid,n:1});go()}
function chg(mid,fid,d){const m=ml(mid),s=m.sel.find(x=>x.id==fid);if(d>0&&can(m,fd(fid)))return;s.n+=d;if(s.n<=0)m.sel=m.sel.filter(x=>x!==s);go()}
function go(){save();render()}
function addVeg(mid){const inp=document.getElementById('vg'+mid);const n=inp.value.trim();if(!n)return;const m=ml(mid);m.vegs.push(n);inp.value='';go()}
function rmVeg(mid,i){ml(mid).vegs.splice(i,1);go()}

function mealHTML(m){const u=used(m),dims=Object.keys(NAMES).filter(k=>m.req[k]>0);
 const allTabs=m.veg?dims.concat(['veg']):dims;
 if(!allTabs.includes(UI.pick[m.id]))UI.pick[m.id]=dims[0];const pk=UI.pick[m.id];
 const tot=dims.reduce((a,k)=>a+m.req[k],0),us=dims.reduce((a,k)=>a+u[k],0),pct=tot?Math.round(us/tot*100):0;
 const done=dims.length>0&&dims.every(k=>u[k]==m.req[k]),pop=done&&!UI.d[m.id],pf=UI.pw[m.id]??0;UI.d[m.id]=done;UI.pw[m.id]=pct;
 if(UI.open[m.id]===undefined)UI.open[m.id]=true;
 const chips=dims.map(k=>`<span class="chip ${u[k]==m.req[k]?'ok':''}">${NAMES[k]} ${u[k]}/${m.req[k]}</span>`).join('')+(m.veg?`<span class="chip">Vegetales libres${m.vegs.length?' · '+m.vegs.length+' hoy':''}</span>`:'')+(m.lean&&m.req.p?'<span class="chip">Proteína sin grasa</span>':'');
 const tabs=`<span class="tind"></span>`+allTabs.map(k=>`<button class="${k==pk?'on':''}" onclick="UI.pick['${m.id}']='${k}';render()">${k=='veg'?'Vegetales':NAMES[k]}</button>`).join('');
 let body;
 if(pk=='veg'){
  body=`<div class="vegbox"><small>Registra opcionalmente qué vegetales comiste — no afecta si la comida está completa.</small><div class="chips">${m.vegs.map((v,i)=>`<span class="chip vg">${esc(v)}<button aria-label="Quitar ${esc(v)}" onclick="rmVeg('${m.id}',${i})">×</button></span>`).join('')||'<span class="mu" style="font-size:13px">Aún no registras ninguno.</span>'}</div><div class="f"><input id="vg${m.id}" placeholder="Ej. brócoli, pepino…" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addVeg('${m.id}')}"><button onclick="addVeg('${m.id}')">Agregar</button></div></div>`;
 }else{
  const allRows=m.sel.length?`<div class="rows-all">${m.sel.map(s=>{const f=fd(s.id);if(!f)return'';return`<div class="row"><div><b>${esc(f.name)}</b>${TAG[f.cat]||''}<small>${f.amt=='½'?'½':f.amt*s.n} ${esc(f.unit)} · ${s.n} × ${esc(f.note)}</small></div><div class="st"><button aria-label="Quitar una porción" onclick="chg('${m.id}','${s.id}',-1)">−</button><b>${s.n}</b><button aria-label="Agregar una porción" ${can(m,f)?'disabled':''} onclick="chg('${m.id}','${s.id}',1)">+</button></div></div>`}).join('')}</div>`:'<p class="mu">Elige alimentos abajo para armar esta comida.</p>';
  const fl=S.foods.filter(f=>f.on&&PK[pk].includes(f.cat)).map(f=>{const r=can(m,f);return`<button class="fb" ${r?`disabled title="${esc(r)}"`:''} onclick="add('${m.id}','${f.id}')">${esc(f.name)}${TAG[f.cat]||''}<small>${esc(f.amt)} ${esc(f.unit)} · ${esc(f.note)}</small></button>`}).join('')||'<p class="mu">No hay alimentos activos en esta categoría.</p>';
  body=allRows+`<div class="grid">${fl}</div>`;
 }
 return`<section class="card ${done?'done':''} ${pop?'pop':''} ${UI.open[m.id]?'open':''}" id="c${m.id}"><button class="mh" onclick="tgc('${m.id}',this)" aria-expanded="${!!UI.open[m.id]}"><span class="mt"><b>${esc(m.name)}</b><small>${done?'✓ Comida completa':us+' de '+tot+' porciones'}</small></span><span class="pc">${pct}%</span><svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button><div class="bar"><i style="--f:${pf}%;--w:${pct}%"></i></div><div class="bd"><div class="bi"><div class="chips">${chips}</div><div class="tabs" data-mid="${m.id}">${tabs}</div>${body}</div></div></section>`}
function tgc(id,b){UI.open[id]=!UI.open[id];document.getElementById('c'+id).classList.toggle('open',UI.open[id]);b.setAttribute('aria-expanded',UI.open[id])}
function hero(){let t=0,us=0,dn=0;S.meals.forEach(m=>{const u=used(m),d=Object.keys(NAMES).filter(k=>m.req[k]>0);d.forEach(k=>{t+=m.req[k];us+=u[k]});if(d.length&&d.every(k=>u[k]==m.req[k]))dn++});
 const pct=t?Math.round(us/t*100):0,pf=UI.pw.h??0,sd=S.supps.filter(x=>x.done).length;UI.pw.h=pct;
 return`<section class="card hero"><small>${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</small><div class="big">${dn}<span>/${S.meals.length}</span></div><b>comidas completas</b><div class="bar"><i style="--f:${pf}%;--w:${pct}%"></i></div><div class="tiles"><div><small>Porciones</small><b>${us}/${t}</b></div><div><small>Suplementos</small><b id="hs">${sd}/${S.supps.length}</b></div></div></section>`}
function suppCheck(){const d=S.supps.filter(x=>x.done).length,all=S.supps.length>0&&d==S.supps.length;return`<section class="card ${all?'done':''}" id="sc"><div class="hd"><h2>Suplementos de hoy</h2><span class="ok-t ${all?'':'hide'}" id="sok">✓ Todos tomados</span></div><small id="sct">${d} de ${S.supps.length} tomados · se reinicia cada día</small>`+S.supps.map(x=>`<label class="chk"><span style="flex:1"><b>${esc(x.name)}</b><small>${esc(x.dose||'Sin dosis anotada')}</small></span><input type="checkbox" class="sw" ${x.done?'checked':''} onchange="tg('${x.id}')" aria-label="Tomado"></label>`).join('')+`</section>`}
function suppEdit(){return`<section class="card"><h2>Editar suplementos</h2><small>Los cambios se reflejan en el checklist de la pestaña Hoy.</small>`+S.supps.map(x=>`<div class="f"><input value="${esc(x.name)}" onchange="ed('${x.id}','name',this.value)" style="flex:1"><input value="${esc(x.dose)}" placeholder="Dosis" onchange="ed('${x.id}','dose',this.value)" style="flex:1"><button class="x" onclick="rs('${x.id}')">Quitar</button></div>`).join('')+`<div class="f"><input id="sn" placeholder="Nuevo suplemento" style="flex:1"><input id="sd" placeholder="Dosis" style="flex:1"><button onclick="as()">Agregar</button></div></section>`}
const tg=id=>{const x=S.supps.find(s=>s.id==id);x.done=!x.done;save();const d=S.supps.filter(x=>x.done).length,all=d==S.supps.length;sc.classList.toggle('done',all);sok.classList.toggle('hide',!all);sct.textContent=d+' de '+S.supps.length+' tomados · se reinicia cada día';hs.textContent=d+'/'+S.supps.length};
const ed=(id,k,v)=>{S.supps.find(s=>s.id==id)[k]=v;save()};
const rs=id=>{S.supps=S.supps.filter(s=>s.id!=id);go()};
function as(){const n=sn.value.trim();if(!n)return;S.supps.push({id:uid(),name:n,dose:sd.value.trim(),done:false});go()}
function foodsHTML(){const g=Object.keys(CN).map(c=>{const l=S.foods.filter(f=>f.cat==c);return`<details><summary>${CN[c]} <small style="display:inline">(${l.filter(f=>f.on).length}/${l.length} activos)</small></summary>`+l.map(f=>`<label class="t"><input type="checkbox" ${f.on?'checked':''} onchange="fo('${f.id}')"><span style="flex:1">${esc(f.name)} <small style="display:inline">${esc(f.amt)} ${esc(f.unit)} · ${esc(f.note)}</small></span>${f.custom?`<button class="x" onclick="fx('${f.id}')">Borrar</button>`:''}</label>`).join('')+'</details>'}).join('');
 return`<section class="card"><h2>Mis alimentos</h2><small>Desmarca lo que no comes (ahora: huevo y arroz). Solo los marcados aparecen al armar comidas.</small>${g}</section>
<section class="card"><h2>Agregar alimento</h2><small>Una porción = lo que equivale a una unidad de su categoría en la tabla.</small><div class="f"><input id="an" placeholder="Nombre" style="flex:1 1 100%"><select id="ac">${Object.keys(CN).map(c=>`<option value="${c}">${CN[c]}</option>`).join('')}</select><input id="aa" type="number" placeholder="Cant." min="0" step="any"><input id="au" placeholder="g / ml / unidad" style="width:110px"><input id="ao" placeholder="Medida casera" style="flex:1"><button onclick="af()">Agregar</button></div></section>`}
const fo=id=>{const f=fd(id);f.on=!f.on;go()};
const fx=id=>{S.foods=S.foods.filter(f=>f.id!=id);S.meals.forEach(m=>m.sel=m.sel.filter(s=>s.id!=id));go()};
function af(){const n=an.value.trim();if(!n)return;S.foods.push({id:uid(),cat:ac.value,name:n,amt:aa.value||'1',unit:au.value.trim()||'porción',note:ao.value.trim()||'1 porción',on:true,custom:true});go()}
function planHTML(){return`<section class="card"><h2>Estructura del día</h2><small>Cambia las porciones cuando tu nutricionista ajuste el plan. Los vegetales son libres.</small></section>`+S.meals.map(m=>`<section class="card"><div class="f"><input value="${esc(m.name)}" style="flex:1;font-weight:600" onchange="pm('${m.id}','name',this.value)"><button class="x" onclick="dm('${m.id}')">Eliminar</button></div><div class="f">${Object.keys(NAMES).map(k=>`<label>${NAMES[k]}<br><input type="number" min="0" max="12" value="${m.req[k]}" onchange="pr('${m.id}','${k}',this.value)"></label>`).join('')}</div><label class="t"><input type="checkbox" ${m.lean?'checked':''} onchange="pm('${m.id}','lean',this.checked)">Solo proteína sin grasa</label><label class="t"><input type="checkbox" ${m.veg?'checked':''} onchange="pm('${m.id}','veg',this.checked)">Incluye vegetales</label></section>`).join('')+`<button onclick="nm()" style="width:100%">Agregar comida (colación, merienda…)</button><button class="x" onclick="if(confirm('¿Borrar todo y volver al plan original?')){S=init();go()}" style="width:100%;margin-top:10px">Restablecer plan original</button>`}
const pm=(id,k,v)=>{ml(id)[k]=v;go()};
const pr=(id,k,v)=>{ml(id).req[k]=Math.max(0,+v||0);go()};
const dm=id=>{if(confirm('¿Eliminar esta comida?')){S.meals=S.meals.filter(m=>m.id!=id);go()}};
const nm=()=>{S.meals.push(M('Colación',{c:1,f:1},false,false));go()};
const IC={m:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',f:'<path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14zM5 19c3-4 6-7 10-9"/>',p:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',s:'<path d="M10.5 20.5a4.5 4.5 0 0 1-6.4-6.4l9.9-9.9a4.5 4.5 0 0 1 6.4 6.4z"/><path d="M8.5 8.5l7 7"/>'};
const T={m:'Hoy',f:'Alimentos',p:'Plan',s:'Suplementos'},K=Object.keys(T);
function render(){
 ttl.value=S.title||'Mi plan nutricional';document.title=ttl.value;
 if(!nav.children.length)nav.innerHTML='<i class="ind"></i>'+K.map(k=>`<button data-k="${k}" onclick="UI.tab='${k}';UI.anim=1;render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">${IC[k]}</svg><span>${T[k]}</span></button>`).join('');
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k==UI.tab));nav.querySelector('.ind').style.transform=`translateX(${K.indexOf(UI.tab)*100}%)`;
 v.innerHTML=UI.tab=='m'?hero()+suppCheck()+S.meals.map(mealHTML).join('')+`<button class="x" onclick="S.meals.forEach(m=>{m.sel=[];m.vegs=[]});S.supps.forEach(x=>x.done=false);UI.d={};go()">Limpiar el día</button>`:UI.tab=='s'?suppEdit():UI.tab=='f'?foodsHTML():planHTML();
 if(UI.anim){v.classList.remove('in');void v.offsetWidth;v.classList.add('in');UI.anim=0;clearTimeout(UI.t);UI.t=setTimeout(()=>v.classList.remove('in'),800)}
 syncTabs();}
function syncTabs(){document.querySelectorAll('.tabs[data-mid]').forEach(el=>{
 const on=el.querySelector('button.on'),ind=el.querySelector('.tind');if(!on||!ind)return;
 const l=on.offsetLeft,w=on.offsetWidth,prev=UI.tp[el.dataset.mid];
 ind.style.transition='none';ind.style.width=(prev?prev.w:w)+'px';ind.style.transform='translateX('+(prev?prev.l:l)+'px)';
 void ind.offsetWidth;ind.style.transition='';
 requestAnimationFrame(()=>{ind.style.width=w+'px';ind.style.transform='translateX('+l+'px)'});
 UI.tp[el.dataset.mid]={l,w};
})}
ttl.onchange=()=>{S.title=ttl.value.trim()||'Mi plan nutricional';ttl.value=S.title;document.title=S.title;save()};
render();
</script></body></html>
